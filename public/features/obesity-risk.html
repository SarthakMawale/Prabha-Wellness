<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obesity Risk Analyzer - Prabha Wellness</title>

    <!-- Google Fonts (Outfit) -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Favicon -->
    <link rel="icon" href="../images/PRABHA WELLNESS CENTER ALL FINE.png" type="image/png">

    <!-- Animation Library -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        /* --- FUTURISTIC THEME VARIABLES --- */
        :root {
            --primary-neon: #00E676;
            --primary-dark: #004D40;
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: 1px solid rgba(255, 255, 255, 0.4);
            --glass-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
            --text-main: #1f2937;
            --text-light: #6b7280;
            --bg-body: #f0fdf4;
            --gradient-btn: linear-gradient(135deg, #00C853 0%, #00E676 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            background-image:
                radial-gradient(at 0% 0%, hsla(152, 100%, 93%, 1) 0, transparent 50%),
                radial-gradient(at 50% 0%, hsla(138, 100%, 92%, 1) 0, transparent 50%),
                radial-gradient(at 100% 0%, hsla(156, 100%, 93%, 1) 0, transparent 50%);
            background-attachment: fixed;
            min-height: 100vh;
            color: var(--text-main);
        }

        /* --- PAGE LOADER --- */
        .page-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            z-index: 99999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        .page-loader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary-neon);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* --- NAVBAR --- */
        nav {
            position: sticky;
            top: 15px;
            z-index: 1000;
            margin: 0 20px;
            border-radius: 50px;
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--primary-dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-link {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        .back-link:hover {
            color: var(--primary-dark);
            transform: translateX(-5px);
        }

        /* --- BREADCRUMB --- */
        .breadcrumb-container {
            margin: 30px 20px;
            padding: 15px 30px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .breadcrumb {
            list-style: none;
            display: flex;
            gap: 10px;
            font-size: 0.9rem;
            color: var(--text-light);
        }

        .breadcrumb li a {
            text-decoration: none;
            color: var(--text-light);
        }

        .breadcrumb li a:hover { color: var(--primary-neon); }

        .breadcrumb li::after {
            content: '/';
            margin-left: 10px;
            color: #ccc;
        }

        .breadcrumb li:last-child::after { content: ''; }
        .breadcrumb li.active { color: var(--primary-dark); font-weight: 700; }

        /* --- MAIN CARD --- */
        .feature-container {
            max-width: 550px;
            margin: 40px auto 80px;
            padding: 0 20px;
        }

        .feature-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 40px;
            box-shadow: var(--glass-shadow);
            border: var(--glass-border);
            text-align: center;
            position: relative;
            overflow: hidden;
            animation: floatUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .feature-icon {
            font-size: 2.5rem;
            color: var(--primary-neon);
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.8);
            width: 80px;
            height: 80px;
            line-height: 80px;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 10px 20px rgba(0, 230, 118, 0.2);
        }

        .feature-card h1 {
            color: var(--primary-dark);
            margin-bottom: 10px;
            font-size: 2.2rem;
            font-weight: 800;
        }

        .hinglish-text {
            color: var(--text-light);
            margin-bottom: 30px;
            font-size: 1.05rem;
            line-height: 1.6;
        }

        /* --- INPUTS --- */
        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        .input-wrapper { position: relative; }

        .input-wrapper input,
        .input-wrapper select {
            width: 100%;
            padding: 15px 20px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 15px;
            font-size: 1.1rem;
            outline: none;
            transition: 0.3s;
            background: rgba(255, 255, 255, 0.5);
            font-weight: 500;
            appearance: none;
        }

        .input-wrapper input:focus,
        .input-wrapper select:focus {
            border-color: var(--primary-neon);
            background: white;
            box-shadow: 0 0 0 4px rgba(0, 230, 118, 0.15);
        }

        .unit {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            font-weight: 700;
            font-size: 0.85rem;
            pointer-events: none;
        }

        /* --- BUTTON --- */
        .calc-btn {
            width: 100%;
            padding: 18px;
            background: var(--text-main);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
        }

        .calc-btn:hover {
            background: var(--primary-neon);
            color: black;
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(0, 230, 118, 0.3);
        }

        /* --- RESULT BOX --- */
        .result-box {
            margin-top: 30px;
            padding: 30px;
            border-radius: 20px;
            background: white;
            border: 1px solid rgba(0, 0, 0, 0.05);
            display: none;
            animation: slideUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .risk-heading {
            color:#9ca3af; font-size:0.9rem; font-weight:600; text-transform:uppercase; letter-spacing:1px;
            margin-bottom: 15px;
        }

        .risk-status {
            font-size: 1.8rem;
            font-weight: 800;
            padding: 10px 25px;
            border-radius: 15px;
            display: inline-block;
            margin-bottom: 20px;
            line-height: 1.3;
        }

        /* Risk Levels Colors */
        .risk-low { color: #16a34a; background: #f0fdf4; border: 1px solid #dcfce7; }
        .risk-increased { color: #ca8a04; background: #fefce8; border: 1px solid #fef9c3; }
        .risk-high { color: #ea580c; background: #fff7ed; border: 1px solid #ffedd5; }
        .risk-extreme { color: #dc2626; background: #fef2f2; border: 1px solid #fee2e2; }

        .health-tip {
            font-size: 1rem;
            color: #4b5563;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .cta-action-btn {
            display: inline-block;
            text-decoration: none;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            padding: 14px 35px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(56, 239, 125, 0.3);
        }

        .cta-action-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(56, 239, 125, 0.5);
        }

        @keyframes floatUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 480px) {
            .feature-container { margin-top: 20px; }
            .feature-card { padding: 30px 20px; border-radius: 20px; }
            .risk-status { font-size: 1.5rem; }
        }

        .logo a {
            text-decoration: none;
            color: inherit;
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>

<body>

    <div id="pageLoader" class="page-loader">
        <div class="spinner"></div>
    </div>

    <!-- Navigation -->
    <nav>
        <div class="logo">
            <a href="../index.html"><img src="/images/Only logo.png" alt="Logo"
                    style="width: 40px; height: 40px; margin-right: 10px;">PRABHA WELLNESS</a>
        </div>
        <a href="../features.html" class="back-link" onclick="triggerPageTransition(event, '../features.html')">
            <i class="fas fa-arrow-left"></i> Back
        </a>
    </nav>

    <!-- Breadcrumb -->
    <div class="breadcrumb-container">
        <ul class="breadcrumb">
            <li><a href="../index.html">Home</a></li>
            <li><a href="../features.html" onclick="triggerPageTransition(event, '../features.html')">Features</a></li>
            <li class="active">Obesity Risk</li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="feature-container">
        <div class="feature-card" data-aos="zoom-in">

            <div class="feature-icon"><i class="fas fa-heart-pulse"></i></div>

            <h1>Obesity Risk Analyzer</h1>
            <p class="hinglish-text">
                Apne BMI aur Waist Size ke hisaab se janein ki aapko future mein health problems hone ka kitna khatra hai.
            </p>

            <form id="riskForm" onsubmit="calculateRisk(event)">
                
                <div class="input-group">
                    <label>Gender</label>
                    <div class="input-wrapper">
                        <select id="gender" required>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                        </select>
                        <span class="unit"><i class="fas fa-venus-mars"></i></span>
                    </div>
                </div>

                <div class="input-group">
                    <label>Weight</label>
                    <div class="input-wrapper">
                        <input type="number" id="weight" placeholder="e.g. 75" required min="20" step="0.1">
                        <span class="unit">KG</span>
                    </div>
                </div>

                <div class="input-group">
                    <label>Height</label>
                    <div class="input-wrapper">
                        <input type="number" id="height" placeholder="e.g. 175" required min="50" step="0.1">
                        <span class="unit">CM</span>
                    </div>
                </div>

                <div class="input-group">
                    <label>Waist Size</label>
                    <div class="input-wrapper">
                        <input type="number" id="waist" placeholder="e.g. 34" required min="10" step="0.1">
                        <span class="unit">INCH</span>
                    </div>
                </div>

                <button type="submit" class="calc-btn">
                    Analyze My Risk <i class="fas fa-search-plus"></i>
                </button>
            </form>

            <div id="resultBox" class="result-box">
                <p class="risk-heading">Estimated Health Risk Level</p>
                
                <div id="riskStatus" class="risk-status">Low Risk</div>

                <p class="health-tip" id="healthTip">
                    Result description will appear here.
                </p>

                <!-- Dynamic CTA -->
                <a href="#" id="ctaLink" class="cta-action-btn"
                   onclick="triggerPageTransition(event, this.getAttribute('href'))">
                    Get Action Plan <i class="fas fa-arrow-right" style="margin-left:8px;"></i>
                </a>
            </div>

        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 800, once: true });

        // --- PAGE LOADER ---
        window.addEventListener('load', function () {
            const loader = document.getElementById('pageLoader');
            if (loader) {
                setTimeout(() => {
                    loader.classList.add('hidden');
                    setTimeout(() => { loader.style.display = 'none'; }, 600);
                }, 400);
            }
        });

        function triggerPageTransition(e, targetUrl) {
            if (e && targetUrl && targetUrl !== "#") {
                e.preventDefault();
                const loader = document.getElementById('pageLoader');
                if (loader) {
                    loader.style.display = 'flex';
                    setTimeout(() => {
                        loader.classList.remove('hidden');
                        setTimeout(() => { window.location.href = targetUrl; }, 400);
                    }, 10);
                } else {
                    window.location.href = targetUrl;
                }
            }
        }

        // --- RISK CALCULATION LOGIC ---
        function calculateRisk(e) {
            e.preventDefault();

            const gender = document.getElementById('gender').value;
            const weight = parseFloat(document.getElementById('weight').value);
            const height = parseFloat(document.getElementById('height').value);
            const waist = parseFloat(document.getElementById('waist').value);

            const resultBox = document.getElementById('resultBox');
            const statusEl = document.getElementById('riskStatus');
            const tipEl = document.getElementById('healthTip');
            const ctaBtn = document.getElementById('ctaLink');

            if (weight && height && waist) {
                // 1. Calculate BMI
                const heightM = height / 100;
                const bmi = weight / (heightM * heightM);

                // 2. Check Waist Risk (High if > threshold)
                // Thresholds: Male > 40in, Female > 35in
                let waistRisk = false;
                if (gender === 'male' && waist > 40) waistRisk = true;
                if (gender === 'female' && waist > 35) waistRisk = true;

                // 3. Determine Overall Risk (NIH Guidelines Matrix)
                let riskLevel = "";
                let riskClass = "";
                let tip = "";
                let link = "";

                if (bmi < 25) {
                    // Normal Weight
                    if (!waistRisk) {
                        riskLevel = "Low Risk";
                        riskClass = "risk-low";
                        tip = "Aapka risk level minimal hai. Aap ek healthy lifestyle maintain kar rahe hain.";
                        link = "feature-daily-clry.html";
                    } else {
                        riskLevel = "Moderate Risk"; // Thin-fat phenotype
                        riskClass = "risk-increased";
                        tip = "BMI normal hai par Waist Fat jyada hai. Isse metabolic diseases ka khatra badh sakta hai.";
                        link = "diet-plan.html?type=maintain";
                    }
                } else if (bmi >= 25 && bmi <= 29.9) {
                    // Overweight
                    if (!waistRisk) {
                        riskLevel = "Increased Risk";
                        riskClass = "risk-increased";
                        tip = "Aap Overweight range mein hain. Weight control karna zaroori hai.";
                        link = "diet-plan.html?type=loss";
                    } else {
                        riskLevel = "High Risk";
                        riskClass = "risk-high";
                        tip = "Warning: High BMI aur High Waist Size ka combination dil ki bimariyon ka khatra badhata hai.";
                        link = "diet-plan.html?type=loss";
                    }
                } else if (bmi >= 30 && bmi <= 34.9) {
                    // Obesity Class I
                    if (!waistRisk) {
                        riskLevel = "High Risk";
                        riskClass = "risk-high";
                        tip = "Aap Obesity range mein hain. Turant healthy diet aur exercise shuru karein.";
                        link = "diet-plan.html?type=fat-loss";
                    } else {
                        riskLevel = "Very High Risk";
                        riskClass = "risk-extreme";
                        tip = "Alert: Aapka weight health ke liye dangerous ho sakta hai. Expert guidance lein.";
                        link = "diet-plan.html?type=fat-loss";
                    }
                } else {
                    // Obesity Class II & III (BMI > 35)
                    riskLevel = "Extremely High Risk";
                    riskClass = "risk-extreme";
                    tip = "Critical Alert: Is level par medical complications ka khatra bahut jyada hota hai.";
                    link = "diet-plan.html?type=fat-loss";
                }

                statusEl.innerText = riskLevel;
                statusEl.className = `risk-status ${riskClass}`;
                tipEl.innerText = tip;
                ctaBtn.setAttribute('href', link);

                resultBox.style.display = 'block';
                setTimeout(() => {
                    resultBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }, 100);

            } else {
                alert("Please enter all details correctly.");
            }
        }
    </script>
</body>

</html>
