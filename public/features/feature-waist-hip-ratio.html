<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waist-Hip Ratio - Prabha Wellness</title>

    <!-- Google Fonts (Outfit) -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Favicon -->
    <link rel="icon" href="../images/PRABHA WELLNESS CENTER ALL FINE.png" type="image/png">

    <!-- Animation Library -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        /* --- FUTURISTIC THEME VARIABLES --- */
        :root {
            --primary-neon: #00E676;
            --primary-dark: #004D40;
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: 1px solid rgba(255, 255, 255, 0.4);
            --glass-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
            --text-main: #1f2937;
            --text-light: #6b7280;
            --bg-body: #f0fdf4;
            --gradient-btn: linear-gradient(135deg, #00C853 0%, #00E676 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            background-image:
                radial-gradient(at 0% 0%, hsla(152, 100%, 93%, 1) 0, transparent 50%),
                radial-gradient(at 50% 0%, hsla(138, 100%, 92%, 1) 0, transparent 50%),
                radial-gradient(at 100% 0%, hsla(156, 100%, 93%, 1) 0, transparent 50%);
            background-attachment: fixed;
            min-height: 100vh;
            color: var(--text-main);
        }

        /* --- PAGE LOADER --- */
        .page-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            z-index: 99999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        .page-loader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary-neon);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* --- NAVBAR --- */
        nav {
            position: sticky;
            top: 15px;
            z-index: 1000;
            margin: 0 20px;
            border-radius: 50px;
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--primary-dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-link {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        .back-link:hover {
            color: var(--primary-dark);
            transform: translateX(-5px);
        }

        /* --- BREADCRUMB --- */
        .breadcrumb-container {
            margin: 30px 20px;
            padding: 15px 30px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .breadcrumb {
            list-style: none;
            display: flex;
            gap: 10px;
            font-size: 0.9rem;
            color: var(--text-light);
        }

        .breadcrumb li a {
            text-decoration: none;
            color: var(--text-light);
        }

        .breadcrumb li a:hover { color: var(--primary-neon); }

        .breadcrumb li::after {
            content: '/';
            margin-left: 10px;
            color: #ccc;
        }

        .breadcrumb li:last-child::after { content: ''; }
        .breadcrumb li.active { color: var(--primary-dark); font-weight: 700; }

        /* --- MAIN CARD --- */
        .feature-container {
            max-width: 550px;
            margin: 40px auto 80px;
            padding: 0 20px;
        }

        .feature-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 40px;
            box-shadow: var(--glass-shadow);
            border: var(--glass-border);
            text-align: center;
            position: relative;
            overflow: hidden;
            animation: floatUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .feature-icon {
            font-size: 2.5rem;
            color: var(--primary-neon);
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.8);
            width: 80px;
            height: 80px;
            line-height: 80px;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 10px 20px rgba(0, 230, 118, 0.2);
        }

        .feature-card h1 {
            color: var(--primary-dark);
            margin-bottom: 10px;
            font-size: 2.2rem;
            font-weight: 800;
        }

        .hinglish-text {
            color: var(--text-light);
            margin-bottom: 30px;
            font-size: 1.05rem;
            line-height: 1.6;
        }

        /* --- INPUTS --- */
        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        .input-wrapper { position: relative; }

        .input-wrapper input,
        .input-wrapper select {
            width: 100%;
            padding: 15px 20px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 15px;
            font-size: 1.1rem;
            outline: none;
            transition: 0.3s;
            background: rgba(255, 255, 255, 0.5);
            font-weight: 500;
            appearance: none;
        }

        .input-wrapper input:focus,
        .input-wrapper select:focus {
            border-color: var(--primary-neon);
            background: white;
            box-shadow: 0 0 0 4px rgba(0, 230, 118, 0.15);
        }

        .unit {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            font-weight: 700;
            font-size: 0.85rem;
            pointer-events: none;
        }

        /* --- BUTTON --- */
        .calc-btn {
            width: 100%;
            padding: 18px;
            background: var(--text-main);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
        }

        .calc-btn:hover {
            background: var(--primary-neon);
            color: black;
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(0, 230, 118, 0.3);
        }

        /* --- RESULT BOX --- */
        .result-box {
            margin-top: 30px;
            padding: 30px;
            border-radius: 20px;
            background: white;
            border: 1px solid rgba(0, 0, 0, 0.05);
            display: none;
            animation: slideUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .whr-value {
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #004D40 0%, #00E676 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin: 10px 0;
        }

        .whr-status {
            font-size: 1.1rem;
            font-weight: 700;
            padding: 6px 20px;
            border-radius: 50px;
            display: inline-block;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: #f0fdf4;
            color: #16a34a;
            border: 1px solid #dcfce7;
        }

        .risk-level-bar {
            height: 8px;
            width: 100%;
            background: #e5e7eb;
            border-radius: 10px;
            margin: 20px 0;
            overflow: hidden;
            position: relative;
        }

        .risk-fill {
            height: 100%;
            width: 0%;
            background: var(--primary-neon);
            border-radius: 10px;
            transition: width 1s ease;
        }

        /* Status Colors */
        .status-low { color: #16a34a; background: #f0fdf4; border-color: #dcfce7; }
        .fill-low { background: #16a34a; }

        .status-moderate { color: #ca8a04; background: #fefce8; border-color: #fef9c3; }
        .fill-moderate { background: #ca8a04; }

        .status-high { color: #ea580c; background: #fff7ed; border-color: #ffedd5; }
        .fill-high { background: #ea580c; }

        .status-risk { color: #dc2626; background: #fef2f2; border-color: #fee2e2; }
        .fill-risk { background: #dc2626; }

        .health-tip {
            margin-top: 15px;
            font-size: 1rem;
            color: #4b5563;
            line-height: 1.5;
        }

        @keyframes floatUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .feature-container { margin-top: 20px; }
            .feature-card { padding: 30px 20px; border-radius: 20px; }
            .whr-value { font-size: 2.8rem; }
        }

        .logo a {
            text-decoration: none;
            color: inherit;
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>

<body>

    <div id="pageLoader" class="page-loader">
        <div class="spinner"></div>
    </div>

    <!-- Navigation -->
    <nav>
        <div class="logo">
            <a href="../index.html"><img src="/images/Only logo.png" alt="Logo"
                    style="width: 40px; height: 40px; margin-right: 10px;">PRABHA WELLNESS</a>
        </div>

        <a href="../features.html" class="back-link" onclick="triggerPageTransition(event, '../features.html')">
            <i class="fas fa-arrow-left"></i> Back
        </a>
    </nav>

    <!-- Breadcrumb -->
    <div class="breadcrumb-container">
        <ul class="breadcrumb">
            <li><a href="../index.html">Home</a></li>
            <li><a href="../features.html" onclick="triggerPageTransition(event, '../features.html')">Features</a></li>
            <li class="active">Waist-Hip Ratio</li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="feature-container">
        <div class="feature-card" data-aos="zoom-in">

            <div class="feature-icon"><i class="fas fa-ruler-combined"></i></div>

            <h1>Waist-Hip Ratio</h1>
            <p class="hinglish-text">
                Janein ki aapka body fat distribution healthy hai ya nahi. Yeh health risks mapne ka ek behtareen tareeka hai.
            </p>

            <form id="whrForm" onsubmit="calculateWHR(event)">
                
                <!-- Gender Select -->
                <div class="input-group">
                    <label>Gender</label>
                    <div class="input-wrapper">
                        <select id="gender" required>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                        </select>
                        <span class="unit"><i class="fas fa-venus-mars"></i></span>
                    </div>
                </div>

                <!-- Waist Input -->
                <div class="input-group">
                    <label>Waist Circumference</label>
                    <div class="input-wrapper">
                        <input type="number" id="waist" placeholder="e.g. 32" required min="10" step="0.1">
                        <span class="unit">INCH</span>
                    </div>
                </div>

                <!-- Hip Input -->
                <div class="input-group">
                    <label>Hip Circumference</label>
                    <div class="input-wrapper">
                        <input type="number" id="hip" placeholder="e.g. 38" required min="10" step="0.1">
                        <span class="unit">INCH</span>
                    </div>
                </div>

                <button type="submit" class="calc-btn">
                    Calculate Ratio <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <div id="resultBox" class="result-box">
                <p style="color:#9ca3af; font-size:0.9rem; font-weight:600; text-transform:uppercase; letter-spacing:1px;">
                    Your WHR Score</p>
                <div class="whr-value" id="whrValue">--</div>
                
                <div id="whrStatus" class="whr-status">Normal</div>

                <!-- Risk Bar -->
                <div class="risk-level-bar">
                    <div class="risk-fill" id="riskFill"></div>
                </div>

                <p class="health-tip" id="healthTip">
                    Aapka fat distribution healthy zone mein hai.
                </p>

                <!-- Dynamic Link -->
                <a href="#" id="fatCalcLink" class="cta-action-btn"
                   onclick="triggerPageTransition(event, 'feature-body-fat.html')">
                    Check Body Fat % <i class="fas fa-percentage" style="margin-left:8px;"></i>
                </a>
            </div>

        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 800, once: true });

        // --- PAGE LOADER ---
        window.addEventListener('load', function () {
            const loader = document.getElementById('pageLoader');
            if (loader) {
                setTimeout(() => {
                    loader.classList.add('hidden');
                    setTimeout(() => { loader.style.display = 'none'; }, 600);
                }, 400);
            }
        });

        function triggerPageTransition(e, targetUrl) {
            if (e && targetUrl && targetUrl !== "#") {
                e.preventDefault();
                const loader = document.getElementById('pageLoader');
                if (loader) {
                    loader.style.display = 'flex';
                    setTimeout(() => {
                        loader.classList.remove('hidden');
                        setTimeout(() => { window.location.href = targetUrl; }, 400);
                    }, 10);
                } else {
                    window.location.href = targetUrl;
                }
            }
        }

        // --- WHR LOGIC ---
        function calculateWHR(e) {
            e.preventDefault();

            const gender = document.getElementById('gender').value;
            const waist = parseFloat(document.getElementById('waist').value);
            const hip = parseFloat(document.getElementById('hip').value);

            const resultBox = document.getElementById('resultBox');
            const whrValueEl = document.getElementById('whrValue');
            const whrStatusEl = document.getElementById('whrStatus');
            const riskFillEl = document.getElementById('riskFill');
            const tipEl = document.getElementById('healthTip');
            
            if (waist > 0 && hip > 0) {
                const whr = (waist / hip).toFixed(2);
                whrValueEl.innerText = whr;

                let status = '';
                let statusClass = '';
                let fillClass = '';
                let tip = '';
                let fillWidth = '0%';

                if (gender === 'male') {
                    if (whr <= 0.90) {
                        status = 'Low Risk';
                        statusClass = 'status-low';
                        fillClass = 'fill-low';
                        fillWidth = '30%';
                        tip = 'Badhiya! Aapka fat distribution healthy hai.';
                    } else if (whr <= 0.95) {
                        status = 'Moderate Risk';
                        statusClass = 'status-moderate';
                        fillClass = 'fill-moderate';
                        fillWidth = '60%';
                        tip = 'Thoda dhyan dein, belly fat badh raha hai.';
                    } else {
                        status = 'High Risk';
                        statusClass = 'status-risk';
                        fillClass = 'fill-risk';
                        fillWidth = '100%';
                        tip = 'Warning: Visceral fat jyada hai, lifestyle change karein.';
                    }
                } else { // Female
                    if (whr <= 0.80) {
                        status = 'Low Risk';
                        statusClass = 'status-low';
                        fillClass = 'fill-low';
                        fillWidth = '30%';
                        tip = 'Perfect! Aapka waist-to-hip ratio ideal hai.';
                    } else if (whr <= 0.85) {
                        status = 'Moderate Risk';
                        statusClass = 'status-moderate';
                        fillClass = 'fill-moderate';
                        fillWidth = '60%';
                        tip = 'Risk badh sakta hai agar dhyan nahi diya gaya.';
                    } else {
                        status = 'High Risk';
                        statusClass = 'status-risk';
                        fillClass = 'fill-risk';
                        fillWidth = '100%';
                        tip = 'High health risk associated with belly fat.';
                    }
                }

                whrStatusEl.innerText = status;
                whrStatusEl.className = `whr-status ${statusClass}`;
                
                // Update Progress Bar
                riskFillEl.className = `risk-fill ${fillClass}`;
                setTimeout(() => { riskFillEl.style.width = fillWidth; }, 100);

                tipEl.innerText = tip;

                resultBox.style.display = 'block';
                setTimeout(() => {
                    resultBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }, 100);

            } else {
                alert("Please enter valid measurements.");
            }
        }
    </script>
</body>

</html>
