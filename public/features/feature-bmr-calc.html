<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI BMR Calculator - Prabha Wellness</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        :root {
            --primary-neon: #00E676; --primary-dark: #004D40;
            --glass-bg: rgba(255, 255, 255, 0.65); --bg-body: #f0fdf4;
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Outfit',sans-serif; }
        body { background: var(--bg-body); min-height: 100vh; padding: 20px; }

        .feature-container { max-width: 550px; margin: 40px auto; }
        .feature-card {
            background: var(--glass-bg); backdrop-filter: blur(20px);
            border-radius: 30px; padding: 40px; text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
        }

        .bmi-value {
            font-size: 3.5rem; font-weight: 800; color: var(--primary-dark);
            margin: 10px 0;
        }

        .ai-insight-box {
            background: rgba(0, 230, 118, 0.1);
            border-left: 4px solid var(--primary-neon);
            padding: 15px; margin-top: 20px; text-align: left;
            border-radius: 10px; font-size: 0.95rem; line-height: 1.5; color: #004D40;
            display: none; animation: fadeIn 0.5s;
        }
        
        .loading-dots:after {
            content: '.'; animation: dots 1.5s steps(5, end) infinite;
        }
        @keyframes dots { 0%, 20% { content: '.'; } 40% { content: '..'; } 60% { content: '...'; } 100% { content: ''; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Reuse previous CSS for Inputs/Buttons */
        input, select { width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 15px; border:1px solid #ddd; }
        .calc-btn { width: 100%; padding: 15px; background: #1f2937; color: white; border-radius: 50px; cursor: pointer; border: none; font-weight: 700; }
        .calc-btn:hover { background: var(--primary-neon); color: black; }
    </style>
</head>
<body>

    <div class="feature-container">
        <div class="feature-card" data-aos="zoom-in">
            <h1>AI BMR Calculator</h1>
            <p style="color:#666; margin-bottom:20px;">Calculate calories & get AI metabolism advice.</p>

            <form id="bmrForm" onsubmit="calculateBMR(event)">
                <select id="gender"><option value="male">Male</option><option value="female">Female</option></select>
                <input type="number" id="age" placeholder="Age (Years)" required>
                <input type="number" id="weight" placeholder="Weight (KG)" required>
                <input type="number" id="height" placeholder="Height (CM)" required>
                <button type="submit" class="calc-btn">Calculate & Ask AI</button>
            </form>

            <div id="resultBox" style="display:none; margin-top:30px;">
                <p>Your Daily BMR</p>
                <div class="bmi-value" id="bmrValue">--</div>
                <p>Calories / Day</p>

                <!-- AI Section -->
                <div id="aiBox" class="ai-insight-box">
                    <strong><i class="fas fa-robot"></i> AI Metabolism Insight:</strong><br>
                    <span id="aiText">Analyzing your metabolism<span class="loading-dots"></span></span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init();

        async function calculateBMR(e) {
            e.preventDefault();
            const gender = document.getElementById('gender').value;
            const age = document.getElementById('age').value;
            const weight = document.getElementById('weight').value;
            const height = document.getElementById('height').value;

            // 1. Calculate BMR (Mifflin-St Jeor)
            let bmr = (10 * weight) + (6.25 * height) - (5 * age) + (gender === 'male' ? 5 : -161);
            bmr = Math.round(bmr);

            // Show Result
            document.getElementById('bmrValue').innerText = bmr;
            document.getElementById('resultBox').style.display = 'block';
            
            // Show Loading
            const aiBox = document.getElementById('aiBox');
            const aiText = document.getElementById('aiText');
            aiBox.style.display = 'block';
            aiText.innerHTML = 'Analyzing your metabolism<span class="loading-dots"></span>';

            // 2. Call AI Backend
            try {
                const response = await fetch('/.netlify/functions/fetch-diet', {
                    method: 'POST',
                    body: JSON.stringify({ 
                        type: 'bmr',  // <-- Yeh bata raha hai ki BMR logic use karo
                        data: { gender, age, bmrValue: bmr } 
                    })
                });

                const result = await response.json();
                if(result.reply) {
                    aiText.innerText = result.reply;
                } else {
                    aiText.innerText = "Tip: Drink more water to boost metabolism.";
                }

            } catch (error) {
                console.error(error);
                aiText.innerText = "Connection failed. Eat healthy!";
            }
        }
    </script>
</body>
</html>
