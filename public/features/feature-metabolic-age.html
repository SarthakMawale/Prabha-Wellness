<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metabolic Age Calculator - Prabha Wellness</title>

    <!-- Google Fonts (Outfit) -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Favicon -->
    <link rel="icon" href="../images/PRABHA WELLNESS CENTER ALL FINE.png" type="image/png">

    <!-- Animation Library -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        /* --- FUTURISTIC THEME VARIABLES --- */
        :root {
            --primary-neon: #00E676;
            --primary-dark: #004D40;
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: 1px solid rgba(255, 255, 255, 0.4);
            --glass-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
            --text-main: #1f2937;
            --text-light: #6b7280;
            --bg-body: #f0fdf4;
            --gradient-btn: linear-gradient(135deg, #00C853 0%, #00E676 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            background-image:
                radial-gradient(at 0% 0%, hsla(152, 100%, 93%, 1) 0, transparent 50%),
                radial-gradient(at 50% 0%, hsla(138, 100%, 92%, 1) 0, transparent 50%),
                radial-gradient(at 100% 0%, hsla(156, 100%, 93%, 1) 0, transparent 50%);
            background-attachment: fixed;
            min-height: 100vh;
            color: var(--text-main);
        }

        /* --- PAGE LOADER --- */
        .page-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            z-index: 99999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        .page-loader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary-neon);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* --- NAVBAR --- */
        nav {
            position: sticky;
            top: 15px;
            z-index: 1000;
            margin: 0 20px;
            border-radius: 50px;
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--primary-dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-link {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        .back-link:hover {
            color: var(--primary-dark);
            transform: translateX(-5px);
        }

        /* --- BREADCRUMB --- */
        .breadcrumb-container {
            margin: 30px 20px;
            padding: 15px 30px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .breadcrumb {
            list-style: none;
            display: flex;
            gap: 10px;
            font-size: 0.9rem;
            color: var(--text-light);
        }

        .breadcrumb li a {
            text-decoration: none;
            color: var(--text-light);
        }

        .breadcrumb li a:hover { color: var(--primary-neon); }

        .breadcrumb li::after {
            content: '/';
            margin-left: 10px;
            color: #ccc;
        }

        .breadcrumb li:last-child::after { content: ''; }
        .breadcrumb li.active { color: var(--primary-dark); font-weight: 700; }

        /* --- MAIN CARD --- */
        .feature-container {
            max-width: 550px;
            margin: 40px auto 80px;
            padding: 0 20px;
        }

        .feature-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 40px;
            box-shadow: var(--glass-shadow);
            border: var(--glass-border);
            text-align: center;
            position: relative;
            overflow: hidden;
            animation: floatUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .feature-icon {
            font-size: 2.5rem;
            color: var(--primary-neon);
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.8);
            width: 80px;
            height: 80px;
            line-height: 80px;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 10px 20px rgba(0, 230, 118, 0.2);
        }

        .feature-card h1 {
            color: var(--primary-dark);
            margin-bottom: 10px;
            font-size: 2.2rem;
            font-weight: 800;
        }

        .hinglish-text {
            color: var(--text-light);
            margin-bottom: 30px;
            font-size: 1.05rem;
            line-height: 1.6;
        }

        /* --- INPUTS --- */
        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        .input-wrapper { position: relative; }

        .input-wrapper input,
        .input-wrapper select {
            width: 100%;
            padding: 15px 20px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 15px;
            font-size: 1.1rem;
            outline: none;
            transition: 0.3s;
            background: rgba(255, 255, 255, 0.5);
            font-weight: 500;
            appearance: none;
        }

        .input-wrapper input:focus,
        .input-wrapper select:focus {
            border-color: var(--primary-neon);
            background: white;
            box-shadow: 0 0 0 4px rgba(0, 230, 118, 0.15);
        }

        .unit {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            font-weight: 700;
            font-size: 0.85rem;
            pointer-events: none;
        }

        /* --- BUTTON --- */
        .calc-btn {
            width: 100%;
            padding: 18px;
            background: var(--text-main);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
        }

        .calc-btn:hover {
            background: var(--primary-neon);
            color: black;
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(0, 230, 118, 0.3);
        }

        /* --- RESULT BOX --- */
        .result-box {
            margin-top: 30px;
            padding: 30px;
            border-radius: 20px;
            background: white;
            border: 1px solid rgba(0, 0, 0, 0.05);
            display: none;
            animation: slideUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .age-value {
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #004D40 0%, #00E676 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin: 10px 0;
        }

        .age-diff {
            font-size: 1.2rem;
            font-weight: 700;
            padding: 8px 25px;
            border-radius: 50px;
            display: inline-block;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }

        .status-young { color: #16a34a; background: #f0fdf4; border: 1px solid #dcfce7; }
        .status-old { color: #dc2626; background: #fef2f2; border: 1px solid #fee2e2; }
        .status-same { color: #0288d1; background: #e0f7fa; border: 1px solid #b2ebf2; }

        .health-tip {
            margin-top: 15px;
            font-size: 1rem;
            color: #4b5563;
            line-height: 1.5;
        }

        .cta-action-btn {
            display: inline-block;
            margin-top: 25px;
            text-decoration: none;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            padding: 14px 35px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(56, 239, 125, 0.3);
        }

        .cta-action-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(56, 239, 125, 0.5);
        }

        @keyframes floatUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 480px) {
            .feature-container { margin-top: 20px; }
            .feature-card { padding: 30px 20px; border-radius: 20px; }
            .age-value { font-size: 3rem; }
        }

        .logo a {
            text-decoration: none;
            color: inherit;
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>

<body>

    <div id="pageLoader" class="page-loader">
        <div class="spinner"></div>
    </div>

    <!-- Navigation -->
    <nav>
        <div class="logo">
            <a href="../index.html"><img src="/images/Only logo.png" alt="Logo"
                    style="width: 40px; height: 40px; margin-right: 10px;">PRABHA WELLNESS</a>
        </div>
        <a href="../features.html" class="back-link" onclick="triggerPageTransition(event, '../features.html')">
            <i class="fas fa-arrow-left"></i> Back
        </a>
    </nav>

    <!-- Breadcrumb -->
    <div class="breadcrumb-container">
        <ul class="breadcrumb">
            <li><a href="../index.html">Home</a></li>
            <li><a href="../features.html" onclick="triggerPageTransition(event, '../features.html')">Features</a></li>
            <li class="active">Metabolic Age</li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="feature-container">
        <div class="feature-card" data-aos="zoom-in">

            <div class="feature-icon"><i class="fas fa-hourglass-half"></i></div>

            <h1>Metabolic Age Check</h1>
            <p class="hinglish-text">
                Kya aapka sharir aapki asli umar se budha hai ya jawan? Abhi check karein!
            </p>

            <form id="ageForm" onsubmit="calculateMetabolicAge(event)">
                
                <div class="input-group">
                    <label>Actual Age (Chronological)</label>
                    <div class="input-wrapper">
                        <input type="number" id="realAge" placeholder="e.g. 25" required min="10" max="100">
                        <span class="unit">YRS</span>
                    </div>
                </div>

                <div class="input-group">
                    <label>Height</label>
                    <div class="input-wrapper">
                        <input type="number" id="height" placeholder="e.g. 170" required min="50" step="0.1">
                        <span class="unit">CM</span>
                    </div>
                </div>

                <div class="input-group">
                    <label>Weight</label>
                    <div class="input-wrapper">
                        <input type="number" id="weight" placeholder="e.g. 70" required min="20" step="0.1">
                        <span class="unit">KG</span>
                    </div>
                </div>

                <button type="submit" class="calc-btn">
                    Check Metabolic Age <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <div id="resultBox" class="result-box">
                <p style="color:#9ca3af; font-size:0.9rem; font-weight:600; text-transform:uppercase; letter-spacing:1px;">
                    Your Metabolic Age</p>
                <div class="age-value" id="metaAgeValue">--</div>
                
                <div id="ageStatus" class="age-diff">Normal</div>

                <p class="health-tip" id="healthTip">
                    Result description will appear here.
                </p>

                <!-- Dynamic CTA -->
                <a href="#" id="ctaLink" class="cta-action-btn"
                   onclick="triggerPageTransition(event, this.getAttribute('href'))">
                    Improve My Health <i class="fas fa-heartbeat" style="margin-left:8px;"></i>
                </a>
            </div>

        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 800, once: true });

        // --- PAGE LOADER ---
        window.addEventListener('load', function () {
            const loader = document.getElementById('pageLoader');
            if (loader) {
                setTimeout(() => {
                    loader.classList.add('hidden');
                    setTimeout(() => { loader.style.display = 'none'; }, 600);
                }, 400);
            }
        });

        function triggerPageTransition(e, targetUrl) {
            if (e && targetUrl && targetUrl !== "#") {
                e.preventDefault();
                const loader = document.getElementById('pageLoader');
                if (loader) {
                    loader.style.display = 'flex';
                    setTimeout(() => {
                        loader.classList.remove('hidden');
                        setTimeout(() => { window.location.href = targetUrl; }, 400);
                    }, 10);
                } else {
                    window.location.href = targetUrl;
                }
            }
        }

        // --- LOGIC ---
        function calculateMetabolicAge(e) {
            e.preventDefault();

            const realAge = parseInt(document.getElementById('realAge').value);
            const height = parseFloat(document.getElementById('height').value);
            const weight = parseFloat(document.getElementById('weight').value);

            const resultBox = document.getElementById('resultBox');
            const metaAgeEl = document.getElementById('metaAgeValue');
            const statusEl = document.getElementById('ageStatus');
            const tipEl = document.getElementById('healthTip');
            const ctaBtn = document.getElementById('ctaLink');

            if (realAge && height && weight) {
                // Calculate BMI
                const heightM = height / 100;
                const bmi = weight / (heightM * heightM);

                // Base Logic: Ideal BMI is approx 22. Deviation adds/subtracts "Age".
                // This is a simplified heuristic for web engagement.
                let ageDifference = 0;

                if (bmi < 18.5) {
                    // Underweight = Body stressed = slightly older
                    ageDifference = 2; 
                } else if (bmi >= 18.5 && bmi <= 24.9) {
                    // Healthy Weight = Younger
                    ageDifference = -3; 
                    if(bmi > 21 && bmi < 23) ageDifference = -5; // Sweet spot
                } else if (bmi >= 25 && bmi <= 29.9) {
                    // Overweight = Older
                    ageDifference = 5 + (bmi - 25); 
                } else {
                    // Obese = Significantly Older
                    ageDifference = 10 + (bmi - 30) * 1.5;
                }

                let metaAge = Math.round(realAge + ageDifference);
                
                // Safety clamp
                if (metaAge < 12) metaAge = 12;

                metaAgeEl.innerText = metaAge + " Years";

                // Determine Status Message
                let diff = metaAge - realAge;
                let statusMsg = "";
                let statusClass = "";
                let tip = "";
                let link = "";

                if (diff < -1) {
                    statusMsg = `You are ${Math.abs(diff)} Years Younger!`;
                    statusClass = "status-young";
                    tip = "Fantastic! Aapka sharir aapki umar se bhi jawan aur fit hai. Isse maintain rakhein.";
                    link = "feature-daily-clry.html"; // Maintain diet
                } else if (diff > 1) {
                    statusMsg = `You are ${diff} Years Older`;
                    statusClass = "status-old";
                    tip = "Warning: Aapka metabolism slow ho raha hai aur sharir par stress hai. Exercise aur Diet sudharein.";
                    link = "diet-plan.html?type=loss"; // Weight loss diet
                } else {
                    statusMsg = "Matching Actual Age";
                    statusClass = "status-same";
                    tip = "Aapki health average hai. Thoda aur effort daalkar aap ise improve kar sakte hain.";
                    link = "feature-bmr-calc.html";
                }

                statusEl.innerText = statusMsg;
                statusEl.className = `age-diff ${statusClass}`;
                tipEl.innerText = tip;
                ctaBtn.setAttribute('href', link);

                resultBox.style.display = 'block';
                setTimeout(() => {
                    resultBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }, 100);

            } else {
                alert("Please enter valid details.");
            }
        }
    </script>
</body>

</html>
