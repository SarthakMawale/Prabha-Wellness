<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

        rel="stylesheet">
        <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* === PROFESSIONAL BRAND THEME === */
        :root {
            --primary-green: #0B7A6B;
            --primary-green-dark: #065749;
            --primary-green-light: #E0F2F1;
            --secondary-gold: #C6A959;
            --neutral-dark: #1A1A1A;
            --neutral-gray: #4A4A4A;
            --neutral-light: #F8F9FA;
            --neutral-white: #FFFFFF;
            --gradient-primary: linear-gradient(135deg, #0B7A6B 0%, #2D9C8F 100%);
            --shadow-medium: 0 8px 30px rgba(0, 0, 0, 0.08);
            --shadow-large: 0 15px 50px rgba(0, 0, 0, 0.1);
            --border-radius-md: 12px;
            --border-radius-lg: 20px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'satoshi', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(rgba(11, 122, 107, 0.85), rgba(11, 122, 107, 0.9)),
                url("./images/workout.png") center/cover no-repeat fixed;
            color: var(--neutral-white);
        }

        /* === LOADER === */
        .page-loader {
            position: fixed;
            inset: 0;
            background: var(--neutral-white);
            z-index: 99999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        .page-loader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }

        .loader-logo {
            width: 100px;
            height: auto;
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.9;
            }

            50% {
                transform: scale(1.05);
                opacity: 1;
            }
        }

        /* === RESET CONTAINER === */
        .reset-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 50px 40px;
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-large);
            text-align: center;
            animation: floatIn 0.8s ease;
            color: var(--neutral-dark);
        }

        @keyframes floatIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* === LOGO === */
        .logo {
            font-family: 'satoshi', sans-serif;
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--primary-green);
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }

        .logo img {
            width: 50px;
            height: 50px;
        }

        /* === TITLES === */
        .reset-title {
            font-size: 1.8rem;
            color: var(--primary-green);
            margin-bottom: 10px;
            font-family: 'satoshi', sans-serif;
        }

        .reset-subtitle {
            color: var(--neutral-gray);
            margin-bottom: 30px;
            font-size: 1rem;
            line-height: 1.6;
        }

        /* === FORM === */
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: var(--neutral-dark);
            font-weight: 600;
            font-size: 0.95rem;
        }

        .form-input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid rgba(0, 0, 0, 0.1);
            border-radius: var(--border-radius-md);
            font-size: 1rem;
            font-family: 'satoshi', sans-serif;
            transition: all 0.3s;
            background: var(--neutral-white);
            color: var(--neutral-dark);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-green);
            box-shadow: 0 0 0 3px rgba(11, 122, 107, 0.1);
        }

        .form-input::placeholder {
            color: var(--neutral-gray);
        }

        /* === SUBMIT BUTTON === */
        .submit-btn {
            width: 100%;
            padding: 16px;
            margin-top: 25px;
            background: var(--gradient-primary);
            color: var(--neutral-white);
            font-size: 1rem;
            border: 0;
            outline: none;
            border-radius: var(--border-radius-md);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-family: 'satoshi', sans-serif;
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: var(--shadow-medium);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* === MESSAGES === */
        .message {
            color: #e74c3c;
            font-size: 0.9rem;
            margin-top: 15px;
            display: none;
            background: rgba(231, 76, 60, 0.1);
            padding: 12px;
            border-radius: var(--border-radius-md);
            border: 1px solid rgba(231, 76, 60, 0.2);
            text-align: center;
        }

        .success-message {
            color: var(--primary-green);
            background: rgba(11, 122, 107, 0.1);
            border: 1px solid rgba(11, 122, 107, 0.2);
        }

        /* === BACK LINK === */
        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: var(--primary-green);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        /* === TOAST === */
        #toastBox {
            position: fixed;
            top: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: var(--primary-green);
            color: var(--neutral-white);
            padding: 1rem 1.5rem;
            border-radius: var(--border-radius-md);
            box-shadow: var(--shadow-large);
            z-index: 10000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            min-width: 300px;
            max-width: 90%;
        }

        #toastBox.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        /* === PASSWORD STRENGTH === */
        .password-strength {
            margin-top: 10px;
            font-size: 0.85rem;
            display: none;
        }

        .strength-meter {
            height: 4px;
            background: #ddd;
            border-radius: 2px;
            margin: 5px 0;
            overflow: hidden;
        }

        .strength-fill {
            height: 100%;
            width: 0%;
            transition: width 0.3s, background 0.3s;
            border-radius: 2px;
        }

        /* === RESPONSIVE === */
        @media (max-width: 480px) {
            .reset-container {
                padding: 40px 30px;
            }

            .logo {
                font-size: 1.4rem;
            }

            .logo img {
                width: 40px;
                height: 40px;
            }

            .reset-title {
                font-size: 1.5rem;
            }

            .form-input {
                padding: 14px 16px;
            }

            #toastBox {
                min-width: 250px;
                padding: 0.8rem 1.2rem;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 350px) {
            .reset-container {
                padding: 35px 25px;
            }

            .logo {
                font-size: 1.2rem;
            }

            .logo img {
                width: 35px;
                height: 35px;
            }

            .reset-title {
                font-size: 1.3rem;
            }
        }
    </style>
</head>

<body>
    <!-- === LOADER === -->
    <div id="pageLoader" class="page-loader">
        <div class="loader-content">
            <img src="/images/Only logo.png" alt="Prabha Wellness" class="loader-logo">
            <div style="font-family: 'satoshi', sans-serif; font-weight: 700; color: var(--primary-green);">
                PRABHA WELLNESS
            </div>
        </div>
    </div>

    <!-- === TOAST === -->
    <div id="toastBox">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage">Success</span>
    </div>

    <!-- === RESET PASSWORD CONTAINER === -->
    <div class="reset-container">
        <div class="logo">
            <img src="/images/Only logo.png" alt="Logo">
            PRABHA WELLNESS
        </div>

        <h2 class="reset-title"><i class="fas fa-key"></i> Set New Password</h2>
        <p class="reset-subtitle">Create a strong password to secure your account. Minimum 6 characters required.</p>

        <form id="new-password-form">
            <div class="form-group">
                <label class="form-label" for="new-pass">
                    <i class="fas fa-lock"></i> New Password
                </label>
                <input type="password" id="new-pass" class="form-input" placeholder="Enter new password (minimum 6 characters)" required minlength="6">
                
                <!-- Password Strength Indicator -->
                <div class="password-strength" id="passwordStrength">
                    <div class="strength-meter">
                        <div class="strength-fill" id="strengthFill"></div>
                    </div>
                    <div id="strengthText">Password strength: <span id="strengthLabel">Weak</span></div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="confirm-pass">
                    <i class="fas fa-lock"></i> Confirm Password
                </label>
                <input type="password" id="confirm-pass" class="form-input" placeholder="Confirm new password" required minlength="6">
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                <i class="fas fa-sync-alt"></i> Update Password
            </button>

            <div class="message" id="error-msg"></div>
            <div class="message success-message" id="success-msg" style="display: none;"></div>
        </form>

        <a href="login.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Login
        </a>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

    <script>
        // Initialize page loader
        const loader = document.getElementById('pageLoader');
        window.addEventListener('load', () => {
            setTimeout(() => {
                loader.classList.add('hidden');
            }, 800);
        });

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyASK7lbjWDA50G3IJdzU2sEKubkdR0dwgY",
            authDomain: "prabha-wellness.firebaseapp.com",
            projectId: "prabha-wellness",
            storageBucket: "prabha-wellness.firebasestorage.app",
            messagingSenderId: "555332322398",
            appId: "1:555332322398:web:57e29182b8693c35ef60cf",
            measurementId: "G-EQ36VYT215"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // 1. Get parameters from URL
        function getParameterByName(name) {
            const url = window.location.href;
            name = name.replace(/[\[\]]/g, '\\$&');
            const regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)');
            const results = regex.exec(url);
            if (!results) return null;
            if (!results[2]) return '';
            return decodeURIComponent(results[2].replace(/\+/g, ' '));
        }

        const mode = getParameterByName('mode');
        const actionCode = getParameterByName('oobCode');

        // Check if link is valid
        window.addEventListener('load', () => {
            if (mode !== 'resetPassword' || !actionCode) {
                showToast("Invalid or expired password reset link");
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            }
        });

        // 2. Password Strength Checker
        document.getElementById('new-pass').addEventListener('input', function() {
            const password = this.value;
            const strengthDiv = document.getElementById('passwordStrength');
            const strengthFill = document.getElementById('strengthFill');
            const strengthLabel = document.getElementById('strengthLabel');
            
            if (password.length === 0) {
                strengthDiv.style.display = 'none';
                return;
            }
            
            strengthDiv.style.display = 'block';
            
            // Calculate strength
            let strength = 0;
            if (password.length >= 8) strength += 25;
            if (/[A-Z]/.test(password)) strength += 25;
            if (/[0-9]/.test(password)) strength += 25;
            if (/[^A-Za-z0-9]/.test(password)) strength += 25;
            
            // Update display
            strengthFill.style.width = strength + '%';
            
            if (strength < 50) {
                strengthFill.style.background = '#e74c3c';
                strengthLabel.textContent = 'Weak';
            } else if (strength < 75) {
                strengthFill.style.background = '#f39c12';
                strengthLabel.textContent = 'Medium';
            } else {
                strengthFill.style.background = '#2ecc71';
                strengthLabel.textContent = 'Strong';
            }
        });

        // 3. Handle Password Update
        document.getElementById('new-password-form').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const newPassword = document.getElementById('new-pass').value;
            const confirmPassword = document.getElementById('confirm-pass').value;
            const btn = document.getElementById('submitBtn');
            const errorMsg = document.getElementById('error-msg');
            const successMsg = document.getElementById('success-msg');
            
            // Reset messages
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            
            // Validation
            if (newPassword.length < 6) {
                errorMsg.textContent = "Password must be at least 6 characters long";
                errorMsg.style.display = 'block';
                return;
            }
            
            if (newPassword !== confirmPassword) {
                errorMsg.textContent = "Passwords do not match";
                errorMsg.style.display = 'block';
                return;
            }
            
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Updating...';
            btn.disabled = true;
            
            auth.confirmPasswordReset(actionCode, newPassword)
                .then(() => {
                    // Success
                    successMsg.textContent = "Password reset successful! Redirecting to login...";
                    successMsg.style.display = 'block';
                    
                    showToast("Password reset successful!");
                    
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                })
                .catch((error) => {
                    // Error
                    btn.innerHTML = '<i class="fas fa-sync-alt"></i> Update Password';
                    btn.disabled = false;
                    
                    let errorMessage = "An error occurred. Please try again.";
                    
                    switch (error.code) {
                        case 'auth/expired-action-code':
                            errorMessage = "Password reset link has expired. Please request a new one.";
                            break;
                        case 'auth/invalid-action-code':
                            errorMessage = "Invalid password reset link. Please request a new one.";
                            break;
                        case 'auth/weak-password':
                            errorMessage = "Password is too weak. Please choose a stronger password.";
                            break;
                        default:
                            errorMessage = error.message;
                    }
                    
                    errorMsg.textContent = errorMessage;
                    errorMsg.style.display = 'block';
                });
        });

        // Toast Notification
        function showToast(message) {
            const toast = document.getElementById("toastBox");
            document.getElementById("toastMessage").innerText = message;
            toast.classList.add("show");
            setTimeout(() => toast.classList.remove("show"), 3000);
        }

        // Check password match on confirm field change
        document.getElementById('confirm-pass').addEventListener('input', function() {
            const password = document.getElementById('new-pass').value;
            const confirm = this.value;
            const errorMsg = document.getElementById('error-msg');
            
            if (confirm.length === 0) {
                errorMsg.style.display = 'none';
                return;
            }
            
            if (password !== confirm) {
                errorMsg.textContent = "Passwords do not match";
                errorMsg.style.display = 'block';
            } else {
                errorMsg.style.display = 'none';
            }
        });
    </script>
</body>
